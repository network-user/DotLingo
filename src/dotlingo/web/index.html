<!--
  DotLingo - каркас UI (pywebview + vanilla JS, без сборки).
  Страницы регистрируются через js/router.js из js/main.js (волна 2).
-->
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="DotLingo - локальный перевод документов">
  <title>DotLingo</title>
  <!-- Те же цвета, что в tokens.css. Нужны до загрузки таблиц, иначе первый кадр пустой. -->
  <style>
    html, body { height: 100%; margin: 0; background: #0b0b0e; color: #f5f5f7; }
    body { font-family: "Segoe UI", system-ui, sans-serif; }
    #app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100%; }
    .boot__title { margin: 28px 32px 0; font-size: 21px; font-weight: 700; }
    .boot__text { margin: 8px 32px 0; color: rgba(235, 235, 245, 0.72); }
    /*
      Книга: один жест, без качания.
      Открытие 0.92 с: обложка 0.40 с с 0.04 с, шесть листов по 0.30 с с 0.24 с, шаг 0.042 с.
      Закрытие 0.56 с: листы 0.20 с, обложка 0.22 с с 0.32 с.
      Запасной таймер в main.js (0.60 с) и сторож в app.py (0.75 с) длиннее кадра.
    */
    .launch {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: grid;
      place-items: center;
      background: #0b0b0e;
      animation: launch-fade 0.92s linear forwards;
    }
    .launch__stage {
      perspective: 1500px;
      perspective-origin: 50% 42%;
      padding: 48px 0 36px;
    }
    .launch__book {
      position: relative;
      z-index: 1;
      width: min(340px, 74vw);
      height: min(230px, 46vh);
      transform-style: preserve-3d;
      animation: launch-sit 0.64s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .launch__book::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -18px;
      z-index: -1;
      width: 78%;
      height: 22px;
      margin-left: -39%;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.42), transparent 70%);
      animation: launch-shadow 0.64s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    .launch__back,
    .launch__leaf,
    .launch__cover,
    .launch__spine {
      position: absolute;
      top: 0;
    }
    .launch__back {
      width: 50%;
      height: 100%;
      background-color: #f5f5f7;
      background-repeat: no-repeat;
      background-image:
        linear-gradient(rgba(11, 11, 14, 0.5), rgba(11, 11, 14, 0.5)),
        linear-gradient(rgba(11, 11, 14, 0.22), rgba(11, 11, 14, 0.22)),
        linear-gradient(rgba(11, 11, 14, 0.22), rgba(11, 11, 14, 0.22)),
        linear-gradient(rgba(11, 11, 14, 0.18), rgba(11, 11, 14, 0.18));
    }
    .launch__back--left {
      left: 0;
      border-radius: 7px 0 0 7px;
      background-size: 34% 2px, 60% 1.5px, 54% 1.5px, 64% 1.5px;
      background-position: 16px 24px, 16px 36px, 16px 44px, 16px 56px;
      opacity: 0;
      animation: launch-reveal 0.16s ease 0.20s forwards;
    }
    .launch__back--right {
      left: 50%;
      border-radius: 0 7px 7px 0;
      background-size: 28% 2px, 66% 1.5px, 58% 1.5px, 48% 1.5px;
      background-position: 18px 28px, 18px 42px, 18px 50px, 18px 62px;
    }
    .launch__leaf,
    .launch__cover {
      left: 50%;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
    }
    .launch__leaf {
      z-index: calc(40 - var(--i));
      animation: launch-leaf 0.30s linear both;
      animation-delay: calc(0.24s + var(--i) * 0.042s);
    }
    .launch__cover { z-index: 48; animation: launch-cover 0.40s linear 0.04s both; }
    .launch__leaf span,
    .launch__cover span {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      background-color: #f5f5f7;
    }
    .launch__leaf span:first-child,
    .launch__cover span:first-child { border-radius: 0 5px 5px 0; }
    .launch__leaf span:last-child,
    .launch__cover span:last-child {
      transform: rotateY(180deg);
      border-radius: 5px 0 0 5px;
      background-color: #f5f5f7;
      background-repeat: no-repeat;
      background-image:
        linear-gradient(rgba(11, 11, 14, 0.07), rgba(11, 11, 14, 0.07)),
        linear-gradient(rgba(11, 11, 14, 0.4), rgba(11, 11, 14, 0.4)),
        linear-gradient(rgba(11, 11, 14, 0.22), rgba(11, 11, 14, 0.22)),
        linear-gradient(rgba(11, 11, 14, 0.22), rgba(11, 11, 14, 0.22));
      background-size: auto, 48% 1.5px, 70% 1.5px, 58% 1.5px;
      background-position: 0 0, 14px 22px, 14px 34px, 14px 46px;
    }
    .launch__leaf span:first-child {
      background-repeat: no-repeat;
      background-image:
        linear-gradient(rgba(11, 11, 14, 0.55), rgba(11, 11, 14, 0.55)),
        linear-gradient(rgba(11, 11, 14, 0.24), rgba(11, 11, 14, 0.24)),
        linear-gradient(rgba(11, 11, 14, 0.24), rgba(11, 11, 14, 0.24)),
        linear-gradient(rgba(11, 11, 14, 0.24), rgba(11, 11, 14, 0.24)),
        linear-gradient(rgba(11, 11, 14, 0.18), rgba(11, 11, 14, 0.18));
      background-size: 40% 2px, 72% 1.5px, 66% 1.5px, 70% 1.5px, 52% 1.5px;
      background-position:
        12px calc(16px + var(--i) * 2px),
        12px calc(28px + var(--i) * 2px),
        12px calc(36px + var(--i) * 2px),
        12px calc(44px + var(--i) * 2px),
        12px calc(56px + var(--i) * 2px);
    }
    .launch__cover span:first-child {
      background-repeat: no-repeat;
      background-image:
        linear-gradient(#0b0b0e, #0b0b0e),
        linear-gradient(rgba(11, 11, 14, 0.35), rgba(11, 11, 14, 0.35)),
        linear-gradient(rgba(11, 11, 14, 0.2), rgba(11, 11, 14, 0.2)),
        linear-gradient(rgba(11, 11, 14, 0.2), rgba(11, 11, 14, 0.2)),
        linear-gradient(rgba(11, 11, 14, 0.16), rgba(11, 11, 14, 0.16));
      background-size: 36px 3px, 56px 2px, 68% 1.5px, 60% 1.5px, 64% 1.5px;
      background-position: 16px 28px, 16px 40px, 16px 58px, 16px 68px, 16px 78px;
      box-shadow:
        1px 0 0 rgba(11, 11, 14, 0.22),
        2px 0 0 #f5f5f7,
        3px 0 0 rgba(11, 11, 14, 0.28),
        4px 0 0 #f5f5f7,
        5px 0 0 rgba(11, 11, 14, 0.32),
        6px 0 0 #f5f5f7,
        7px 0 0 rgba(11, 11, 14, 0.24);
    }
    .launch__spine {
      left: 50%;
      top: 7px;
      bottom: 7px;
      width: 9px;
      margin-left: -4px;
      border-radius: 5px;
      z-index: 60;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(11, 11, 14, 0.55), rgba(245, 245, 247, 0.55) 48%, rgba(11, 11, 14, 0.4));
      animation: launch-reveal 0.16s ease 0.20s forwards;
    }
    @keyframes launch-sit {
      from { transform: translate3d(-25%, 6px, 0) rotateX(12deg) scale(0.965); }
      to { transform: translate3d(0, 0, 0) rotateX(6deg) scale(1); }
    }
    @keyframes launch-shadow {
      from { opacity: 0.26; transform: translateX(28%) scaleX(0.55); }
      to { opacity: 0.4; transform: translateX(0) scaleX(1); }
    }
    /* Слой меняется на ребре, пока лист почти не виден. Иначе страница прыгает. */
    @keyframes launch-cover {
      0% {
        transform: rotateY(0deg);
        z-index: 48;
        animation-timing-function: cubic-bezier(0.5, 0, 0.85, 0.45);
      }
      49% { transform: rotateY(-90deg); z-index: 48; }
      50% {
        transform: rotateY(-92deg);
        z-index: 1;
        animation-timing-function: cubic-bezier(0.12, 0.5, 0.2, 1);
      }
      100% { transform: rotateY(-168deg); z-index: 1; }
    }
    @keyframes launch-leaf {
      0% {
        transform: rotateY(0deg);
        z-index: calc(40 - var(--i));
        animation-timing-function: cubic-bezier(0.5, 0, 0.85, 0.45);
      }
      49% { transform: rotateY(-90deg); z-index: calc(40 - var(--i)); }
      50% {
        transform: rotateY(-92deg);
        z-index: calc(3 + var(--i));
        animation-timing-function: cubic-bezier(0.12, 0.5, 0.2, 1);
      }
      100% { transform: rotateY(-168deg); z-index: calc(3 + var(--i)); }
    }
    @keyframes launch-reveal { to { opacity: 1; } }
    @keyframes launch-fade {
      0%, 84% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    /* Закрытие сразу с открытого разворота. Прозрачность родителя схлопнула бы 3D. */
    .launch.is-closing {
      visibility: visible;
      opacity: 1;
      animation: none;
    }
    .launch.is-closing .launch__book {
      animation: close-sit 0.56s cubic-bezier(0.55, 0, 1, 1) both;
    }
    .launch.is-closing .launch__book::after {
      animation: close-shadow 0.56s cubic-bezier(0.55, 0, 1, 1) both;
    }
    .launch.is-closing .launch__leaf {
      animation: close-leaf 0.20s linear both;
      animation-delay: calc((5 - var(--i)) * 0.036s);
    }
    .launch.is-closing .launch__cover {
      animation: close-cover 0.22s linear 0.32s both;
    }
    .launch.is-closing .launch__back--left,
    .launch.is-closing .launch__spine {
      opacity: 1;
      animation: close-hide 0.1s ease 0.46s forwards;
    }
    @keyframes close-sit {
      from { transform: translate3d(0, 0, 0) rotateX(6deg) scale(1); }
      to { transform: translate3d(-25%, 0, 0) rotateX(8deg) scale(0.985); }
    }
    @keyframes close-shadow {
      from { opacity: 0.4; transform: translateX(0) scaleX(1); }
      to { opacity: 0.24; transform: translateX(28%) scaleX(0.55); }
    }
    @keyframes close-leaf {
      0% {
        transform: rotateY(-168deg);
        z-index: calc(3 + var(--i));
        animation-timing-function: cubic-bezier(0.45, 0, 0.9, 0.5);
      }
      49% { transform: rotateY(-90deg); z-index: calc(3 + var(--i)); }
      50% {
        transform: rotateY(-88deg);
        z-index: calc(40 - var(--i));
        animation-timing-function: cubic-bezier(0.08, 0.45, 0.2, 1);
      }
      100% { transform: rotateY(0deg); z-index: calc(40 - var(--i)); }
    }
    @keyframes close-cover {
      0% {
        transform: rotateY(-168deg);
        z-index: 1;
        animation-timing-function: cubic-bezier(0.45, 0, 0.9, 0.5);
      }
      49% { transform: rotateY(-90deg); z-index: 1; }
      50% {
        transform: rotateY(-88deg);
        z-index: 48;
        animation-timing-function: cubic-bezier(0.08, 0.45, 0.2, 1);
      }
      100% { transform: rotateY(0deg); z-index: 48; }
    }
    @keyframes close-hide { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .launch { display: none; }
    }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%230B0B0E'/%3E%3Cpath fill='%23F5F5F7' d='M2.15 4.35Q4.55 3.55 7.05 5.85V11.55Q4.45 11.35 2.15 12.35Z'/%3E%3Cpath fill='%23F5F5F7' d='M13.85 4.35Q11.45 3.55 8.95 5.85V11.55Q11.55 11.35 13.85 12.35Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/pages-work.css">
  <link rel="stylesheet" href="styles/pages-library.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="launch" class="launch" role="presentation">
    <div class="launch__stage">
      <div class="launch__book">
        <div class="launch__back launch__back--left"></div>
        <div class="launch__back launch__back--right"></div>
        <div class="launch__leaf" style="--i:5"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:4"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:3"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:2"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:1"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:0"><span></span><span></span></div>
        <div class="launch__cover"><span></span><span></span></div>
        <div class="launch__spine"></div>
      </div>
    </div>
  </div>
  <div id="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true"></div>
        <div class="brand__text">
          <span class="brand__name">DotLingo</span>
          <span class="brand__sub">локальный перевод</span>
        </div>
        <button
          class="sidebar-toggle"
          id="sidebar-toggle"
          type="button"
          aria-expanded="true"
          aria-controls="nav"
          title="Скрыть вкладки"
        >
          <span class="sidebar-toggle__icon" data-icon="chevron-left"></span>
        </button>
      </div>

      <nav class="nav" id="nav" aria-label="Основная навигация">
        <div class="nav-group">
          <div class="nav-group__label">Работа</div>
          <button class="nav-item is-active" type="button" data-page="chat" aria-keyshortcuts="1">
            <span class="nav-item__icon" data-icon="globe"></span>
            <span class="nav-item__label">
              <span class="nav-item__name">Перевод</span>
              <span class="nav-item__purpose">Файл или текст</span>
            </span>
            <span class="nav-item__hint" title="Клавиша 1">1</span>
          </button>
          <button class="nav-item" type="button" data-page="review" aria-keyshortcuts="2">
            <span class="nav-item__icon" data-icon="search"></span>
            <span class="nav-item__label">
              <span class="nav-item__name">Проверка</span>
              <span class="nav-item__purpose">Править перевод</span>
            </span>
            <span class="nav-item__hint" title="Клавиша 2">2</span>
          </button>
          <button class="nav-item" type="button" data-page="queue" aria-keyshortcuts="3">
            <span class="nav-item__icon" data-icon="list"></span>
            <span class="nav-item__label">
              <span class="nav-item__name">Очередь</span>
              <span class="nav-item__purpose">Что сейчас идёт</span>
            </span>
            <span class="nav-item__hint" title="Клавиша 3">3</span>
          </button>
          <button class="nav-item" type="button" data-page="history" aria-keyshortcuts="4">
            <span class="nav-item__icon" data-icon="clock"></span>
            <span class="nav-item__label">
              <span class="nav-item__name">История</span>
              <span class="nav-item__purpose">Готовые файлы</span>
            </span>
            <span class="nav-item__hint" title="Клавиша 4">4</span>
          </button>
          <button class="nav-item" type="button" data-page="convert" aria-keyshortcuts="5">
            <span class="nav-item__icon" data-icon="convert"></span>
            <span class="nav-item__label">
              <span class="nav-item__name">Конвертер</span>
              <span class="nav-item__purpose">Другой формат</span>
            </span>
            <span class="nav-item__hint" title="Клавиша 5">5</span>
          </button>
        </div>

        <div class="nav-group">
          <div class="nav-group__label">Библиотека</div>
          <button class="nav-item" type="button" data-page="models" aria-keyshortcuts="6">
            <span class="nav-item__icon" data-icon="chip"></span>
            <span class="nav-item__label">
              <span class="nav-item__name">Модели</span>
              <span class="nav-item__purpose">Чем переводим</span>
            </span>
            <span class="nav-item__hint" title="Клавиша 6">6</span>
          </button>
          <button class="nav-item" type="button" data-page="glossary" aria-keyshortcuts="7">
            <span class="nav-item__icon" data-icon="book"></span>
            <span class="nav-item__label">
              <span class="nav-item__name">Глоссарий</span>
              <span class="nav-item__purpose">Свои термины</span>
            </span>
            <span class="nav-item__hint" title="Клавиша 7">7</span>
          </button>
        </div>

        <div class="nav-group">
          <div class="nav-group__label">Приложение</div>
          <button class="nav-item" type="button" data-page="settings" aria-keyshortcuts="8">
            <span class="nav-item__icon" data-icon="settings"></span>
            <span class="nav-item__label">
              <span class="nav-item__name">Настройки</span>
              <span class="nav-item__purpose">Вид и папки</span>
            </span>
            <span class="nav-item__hint" title="Клавиша 8">8</span>
          </button>
        </div>
      </nav>

      <div class="sidebar__footer">
        <button class="active-project" id="active-project" type="button">
          <span class="active-project__icon" data-icon="folder" aria-hidden="true"></span>
          <span class="active-project__kicker">Проект</span>
          <span class="active-project__label" id="active-project-label">Не выбран</span>
        </button>
        <button class="theme-toggle" id="theme-toggle" type="button" title="Переключить тему">
          <span class="theme-toggle__icon" data-icon="sun"></span>
          <span class="theme-toggle__label" id="theme-label">Светлая тема</span>
        </button>
        <div class="device-status" id="device-status" data-state="unknown">
          <span class="device-status__dot"></span>
          <span class="device-status__label" id="device-label">Устройство…</span>
        </div>
      </div>
    </aside>
    <div
      id="sidebar-resize"
      class="sidebar-resize"
      role="separator"
      aria-orientation="vertical"
      aria-label="Ширина боковой панели"
      tabindex="0"
      title="Потяните, чтобы изменить ширину. Двойной щелчок вернёт размер."
    ></div>

    <main class="main">
      <header class="main-header">
        <div class="main-header__titles">
          <div class="main-header__title-row">
            <h1 id="page-title">Перевод</h1>
            <span id="page-help" hidden></span>
          </div>
          <p class="main-header__subtitle" id="page-subtitle">Документ целиком или короткий фрагмент</p>
        </div>
        <div class="main-header__actions" id="page-actions"></div>
      </header>
      <div class="page-scroll" id="page-host">
        <div class="boot" id="boot">
          <p class="boot__title">Перевод</p>
          <p class="boot__text">Открываем перевод…</p>
        </div>
      </div>
    </main>

  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>
    <div style="padding:40px;font-family:system-ui;color:#F5F5F7;background:#0B0B0E;">
      DotLingo требует JavaScript. Включите его и перезапустите приложение.
    </div>
  </noscript>
</body>
</html>
