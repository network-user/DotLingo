<!--
  DotLingo - каркас UI (pywebview + vanilla JS, без сборки).
  Страницы регистрируются через js/router.js из js/main.js (волна 2).
-->
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="DotLingo - локальный перевод документов">
  <title>DotLingo</title>
  <!-- Те же цвета, что в tokens.css. Нужны до загрузки таблиц, иначе первый кадр пустой. -->
  <style>
    html, body { height: 100%; margin: 0; background: #0b0b0e; color: #f5f5f7; }
    body { font-family: "Segoe UI", system-ui, sans-serif; }
    #app { display: grid; grid-template-columns: 252px minmax(0, 1fr); height: 100%; }
    .boot__title { margin: 28px 32px 0; font-size: 21px; font-weight: 700; }
    .boot__text { margin: 8px 32px 0; color: rgba(235, 235, 245, 0.72); }
    /* Книга: ~2.5 с. Крен, разгон листов и догон обложки, не ровный метроном. */
    .launch {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: grid;
      place-items: center;
      background: #0b0b0e;
      animation: launch-fade 2.5s linear forwards;
    }
    .launch__stage {
      perspective: 1100px;
      perspective-origin: 46% 36%;
      padding: 48px 0 36px;
    }
    .launch__book {
      position: relative;
      width: min(340px, 74vw);
      height: min(230px, 46vh);
      transform-style: preserve-3d;
      animation: launch-sit 2.5s linear forwards;
    }
    .launch__back,
    .launch__leaf,
    .launch__cover,
    .launch__spine {
      position: absolute;
      top: 0;
    }
    .launch__back {
      width: 50%;
      height: 100%;
      background-color: #f5f5f7;
      background-repeat: no-repeat;
      background-image:
        linear-gradient(rgba(11, 11, 14, 0.5), rgba(11, 11, 14, 0.5)),
        linear-gradient(rgba(11, 11, 14, 0.22), rgba(11, 11, 14, 0.22)),
        linear-gradient(rgba(11, 11, 14, 0.22), rgba(11, 11, 14, 0.22)),
        linear-gradient(rgba(11, 11, 14, 0.18), rgba(11, 11, 14, 0.18));
    }
    .launch__back--left {
      left: 0;
      border-radius: 7px 0 0 7px;
      background-size: 34% 2px, 60% 1.5px, 54% 1.5px, 64% 1.5px;
      background-position: 16px 24px, 16px 36px, 16px 44px, 16px 56px;
      opacity: 0;
      animation: launch-reveal 0.28s ease 0.36s forwards;
    }
    .launch__back--right {
      left: 50%;
      border-radius: 0 7px 7px 0;
      background-size: 28% 2px, 66% 1.5px, 58% 1.5px, 48% 1.5px;
      background-position: 18px 28px, 18px 42px, 18px 50px, 18px 62px;
    }
    .launch__leaf,
    .launch__cover {
      left: 50%;
      width: 50%;
      height: 100%;
      transform-origin: left center;
      transform-style: preserve-3d;
    }
    .launch__leaf {
      z-index: calc(40 - var(--i));
      animation: launch-leaf 0.52s cubic-bezier(0.45, 0.04, 0.18, 1) both;
      animation-delay: calc(0.5s + var(--i) * 0.095s - var(--i) * var(--i) * 0.004s);
    }
    .launch__cover { z-index: 30; animation: launch-cover 0.78s cubic-bezier(0.34, 0.08, 0.16, 1) 0.16s both; }
    .launch__leaf span,
    .launch__cover span {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      background-color: #f5f5f7;
    }
    .launch__leaf span:first-child,
    .launch__cover span:first-child { border-radius: 0 5px 5px 0; }
    .launch__leaf span:last-child,
    .launch__cover span:last-child {
      transform: rotateY(180deg);
      border-radius: 5px 0 0 5px;
      background-color: #f5f5f7;
      background-repeat: no-repeat;
      background-image:
        linear-gradient(rgba(11, 11, 14, 0.07), rgba(11, 11, 14, 0.07)),
        linear-gradient(rgba(11, 11, 14, 0.4), rgba(11, 11, 14, 0.4)),
        linear-gradient(rgba(11, 11, 14, 0.22), rgba(11, 11, 14, 0.22)),
        linear-gradient(rgba(11, 11, 14, 0.22), rgba(11, 11, 14, 0.22));
      background-size: auto, 48% 1.5px, 70% 1.5px, 58% 1.5px;
      background-position: 0 0, 14px 22px, 14px 34px, 14px 46px;
    }
    .launch__leaf span:first-child {
      background-repeat: no-repeat;
      background-image:
        linear-gradient(rgba(11, 11, 14, 0.55), rgba(11, 11, 14, 0.55)),
        linear-gradient(rgba(11, 11, 14, 0.24), rgba(11, 11, 14, 0.24)),
        linear-gradient(rgba(11, 11, 14, 0.24), rgba(11, 11, 14, 0.24)),
        linear-gradient(rgba(11, 11, 14, 0.24), rgba(11, 11, 14, 0.24)),
        linear-gradient(rgba(11, 11, 14, 0.18), rgba(11, 11, 14, 0.18));
      background-size: 40% 2px, 72% 1.5px, 66% 1.5px, 70% 1.5px, 52% 1.5px;
      background-position:
        12px calc(16px + var(--i) * 2px),
        12px calc(28px + var(--i) * 2px),
        12px calc(36px + var(--i) * 2px),
        12px calc(44px + var(--i) * 2px),
        12px calc(56px + var(--i) * 2px);
    }
    .launch__cover span:first-child {
      background-repeat: no-repeat;
      background-image:
        linear-gradient(#0b0b0e, #0b0b0e),
        linear-gradient(rgba(11, 11, 14, 0.35), rgba(11, 11, 14, 0.35)),
        linear-gradient(rgba(11, 11, 14, 0.2), rgba(11, 11, 14, 0.2)),
        linear-gradient(rgba(11, 11, 14, 0.2), rgba(11, 11, 14, 0.2)),
        linear-gradient(rgba(11, 11, 14, 0.16), rgba(11, 11, 14, 0.16));
      background-size: 36px 3px, 56px 2px, 68% 1.5px, 60% 1.5px, 64% 1.5px;
      background-position: 16px 28px, 16px 40px, 16px 58px, 16px 68px, 16px 78px;
      box-shadow:
        1px 0 0 rgba(11, 11, 14, 0.22),
        2px 0 0 #f5f5f7,
        3px 0 0 rgba(11, 11, 14, 0.28),
        4px 0 0 #f5f5f7,
        5px 0 0 rgba(11, 11, 14, 0.32),
        6px 0 0 #f5f5f7,
        7px 0 0 rgba(11, 11, 14, 0.24);
    }
    .launch__spine {
      left: 50%;
      top: 7px;
      bottom: 7px;
      width: 9px;
      margin-left: -4px;
      border-radius: 5px;
      z-index: 36;
      opacity: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(11, 11, 14, 0.55), rgba(245, 245, 247, 0.55) 48%, rgba(11, 11, 14, 0.4));
      animation: launch-reveal 0.22s ease 0.48s forwards;
    }
    @keyframes launch-sit {
      0% { transform: translateX(-25%) translateY(16px) rotateX(18deg) rotateZ(-7deg) scale(0.84); }
      12% { transform: translateX(-20%) translateY(-2px) rotateX(11deg) rotateZ(-2deg) scale(1.03); }
      26% { transform: translateX(-6%) translateY(-10px) rotateX(7deg) rotateZ(4deg) scale(1); }
      44% { transform: translateX(3%) translateY(4px) rotateX(10deg) rotateZ(-3.2deg) scale(1.015); }
      62% { transform: translateX(-2%) translateY(-6px) rotateX(5deg) rotateZ(2.2deg) scale(1); }
      80% { transform: translateX(1%) translateY(2px) rotateX(8deg) rotateZ(-0.8deg) scale(1); }
      100% { transform: translateX(0) translateY(0) rotateX(7deg) rotateZ(0deg) scale(1); }
    }
    @keyframes launch-cover {
      0% { transform: rotateY(0deg) rotateZ(0deg); z-index: 30; }
      58% { transform: rotateY(-192deg) rotateZ(-4deg); z-index: 30; }
      78% { transform: rotateY(-160deg) rotateZ(1.6deg); z-index: 6; }
      100% { transform: rotateY(-172deg) rotateZ(0deg); z-index: 1; }
    }
    @keyframes launch-leaf {
      0% { transform: rotateY(0deg) rotateZ(0deg) translateY(0); z-index: calc(40 - var(--i)); }
      36% {
        transform: rotateY(-78deg) rotateZ(calc((var(--i) - 5.5) * 1.1deg)) translateY(-16px);
        z-index: calc(40 - var(--i));
      }
      64% {
        transform: rotateY(-158deg) rotateZ(calc((5.5 - var(--i)) * 0.7deg)) translateY(5px);
        z-index: calc(2 + var(--i));
      }
      84% { transform: rotateY(-188deg) rotateZ(1deg) translateY(-3px); z-index: calc(2 + var(--i)); }
      100% { transform: rotateY(-176deg) rotateZ(0deg) translateY(0); z-index: calc(2 + var(--i)); }
    }
    @keyframes launch-reveal { to { opacity: 1; } }
    @keyframes launch-fade {
      0%, 90% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }
    /* Закрытие: открытый разворот, страницы возвращаются, обложка захлопывается. */
    .launch.is-closing {
      visibility: visible;
      animation: close-in 0.16s ease both;
    }
    .launch.is-closing .launch__book {
      animation: close-sit 2.1s linear both;
    }
    .launch.is-closing .launch__leaf {
      z-index: calc(12 + var(--i));
      animation: close-leaf 0.44s cubic-bezier(0.5, 0.02, 0.18, 1) both;
      animation-delay: calc((11 - var(--i)) * 0.078s - (11 - var(--i)) * (11 - var(--i)) * 0.0032s);
    }
    .launch.is-closing .launch__cover {
      animation: close-cover 0.58s cubic-bezier(0.45, 0.02, 0.2, 1) 0.78s both;
    }
    .launch.is-closing .launch__back--left,
    .launch.is-closing .launch__spine {
      opacity: 1;
      animation: close-hide 0.28s ease 1.2s forwards;
    }
    @keyframes close-in {
      from { opacity: 0; visibility: visible; }
      to { opacity: 1; visibility: visible; }
    }
    @keyframes close-sit {
      0% { transform: translateX(0) translateY(0) rotateX(7deg) rotateZ(0deg) scale(1); }
      16% { transform: translateX(2%) translateY(-8px) rotateX(8deg) rotateZ(3.4deg) scale(1.02); }
      36% { transform: translateX(-3%) translateY(5px) rotateX(6deg) rotateZ(-4deg) scale(1); }
      58% { transform: translateX(-12%) translateY(-4px) rotateX(11deg) rotateZ(2.4deg) scale(1.02); }
      76% { transform: translateX(-28%) translateY(8px) rotateX(15deg) rotateZ(-1.6deg) scale(0.93); }
      88% { transform: translateX(-22%) translateY(-3px) rotateX(10deg) rotateZ(0.6deg) scale(0.99); }
      100% { transform: translateX(-25%) translateY(0) rotateX(12deg) rotateZ(0deg) scale(0.96); }
    }
    @keyframes close-leaf {
      0% { transform: rotateY(-176deg) rotateZ(0deg) translateY(0); z-index: calc(12 + var(--i)); }
      32% {
        transform: rotateY(-104deg) rotateZ(calc((var(--i) - 5.5) * -1.15deg)) translateY(-18px);
        z-index: 70;
      }
      66% {
        transform: rotateY(-18deg) rotateZ(calc((5.5 - var(--i)) * 0.55deg)) translateY(4px);
        z-index: 70;
      }
      84% { transform: rotateY(8deg) rotateZ(-1deg) translateY(-2px); z-index: calc(28 - var(--i)); }
      100% { transform: rotateY(0deg) rotateZ(0deg) translateY(0); z-index: calc(28 - var(--i)); }
    }
    @keyframes close-cover {
      0% { transform: rotateY(-172deg) rotateZ(0deg); z-index: 1; }
      48% { transform: rotateY(-24deg) rotateZ(3deg); z-index: 36; }
      72% { transform: rotateY(11deg) rotateZ(-2deg); z-index: 36; }
      100% { transform: rotateY(0deg) rotateZ(0deg); z-index: 36; }
    }
    @keyframes close-hide { to { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .launch { display: none; }
    }
  </style>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0B0E'/%3E%3Crect x='8' y='7' width='13' height='18' rx='2' fill='%23F5F5F7'/%3E%3Crect x='19' y='8' width='5' height='16' rx='1' fill='%23F5F5F7'/%3E%3Cpath d='M11 10v12' stroke='%230B0B0E' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/pages-work.css">
  <link rel="stylesheet" href="styles/pages-library.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="launch" class="launch" role="presentation">
    <div class="launch__stage">
      <div class="launch__book">
        <div class="launch__back launch__back--left"></div>
        <div class="launch__back launch__back--right"></div>
        <div class="launch__leaf" style="--i:11"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:10"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:9"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:8"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:7"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:6"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:5"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:4"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:3"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:2"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:1"><span></span><span></span></div>
        <div class="launch__leaf" style="--i:0"><span></span><span></span></div>
        <div class="launch__cover"><span></span><span></span></div>
        <div class="launch__spine"></div>
      </div>
    </div>
  </div>
  <div id="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true"></div>
        <div class="brand__text">
          <span class="brand__name">DotLingo</span>
          <span class="brand__sub">локальный перевод</span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Основная навигация">
        <div class="nav-group">
          <div class="nav-group__label">Работа</div>
          <button class="nav-item" type="button" data-page="chat">
            <span class="nav-item__icon" data-icon="message"></span>
            <span class="nav-item__label">Диалог</span>
            <span class="nav-item__hint">1</span>
          </button>
          <button class="nav-item is-active" type="button" data-page="projects">
            <span class="nav-item__icon" data-icon="folder"></span>
            <span class="nav-item__label">Проекты</span>
            <span class="nav-item__hint">2</span>
          </button>
          <button class="nav-item" type="button" data-page="documents">
            <span class="nav-item__icon" data-icon="document"></span>
            <span class="nav-item__label">Документы</span>
            <span class="nav-item__hint">3</span>
          </button>
          <button class="nav-item" type="button" data-page="review">
            <span class="nav-item__icon" data-icon="search"></span>
            <span class="nav-item__label">Проверка</span>
            <span class="nav-item__hint">4</span>
          </button>
          <button class="nav-item" type="button" data-page="queue">
            <span class="nav-item__icon" data-icon="list"></span>
            <span class="nav-item__label">Очередь</span>
            <span class="nav-item__hint">5</span>
          </button>
        </div>

        <div class="nav-group">
          <div class="nav-group__label">Библиотека</div>
          <button class="nav-item" type="button" data-page="models">
            <span class="nav-item__icon" data-icon="chip"></span>
            <span class="nav-item__label">Модели</span>
            <span class="nav-item__hint">6</span>
          </button>
          <button class="nav-item" type="button" data-page="glossary">
            <span class="nav-item__icon" data-icon="book"></span>
            <span class="nav-item__label">Глоссарий</span>
            <span class="nav-item__hint">7</span>
          </button>
        </div>

        <div class="nav-group">
          <div class="nav-group__label">Приложение</div>
          <button class="nav-item" type="button" data-page="settings">
            <span class="nav-item__icon" data-icon="settings"></span>
            <span class="nav-item__label">Настройки</span>
            <span class="nav-item__hint">8</span>
          </button>
        </div>
      </nav>

      <div class="sidebar__footer">
        <button class="active-project" id="active-project" type="button">
          <span class="active-project__kicker">Проект</span>
          <span class="active-project__label" id="active-project-label">Не выбран</span>
        </button>
        <button class="theme-toggle" id="theme-toggle" type="button" title="Переключить тему">
          <span class="theme-toggle__icon" data-icon="sun"></span>
          <span class="theme-toggle__label" id="theme-label">Светлая тема</span>
        </button>
        <div class="device-status" id="device-status" data-state="unknown">
          <span class="device-status__dot"></span>
          <span class="device-status__label" id="device-label">Устройство…</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="main-header__titles">
          <div class="main-header__title-row">
            <h1 id="page-title">Проекты</h1>
            <span id="page-help" hidden></span>
          </div>
          <p class="main-header__subtitle" id="page-subtitle">Открыть проект или собрать новый</p>
        </div>
        <div class="main-header__actions" id="page-actions"></div>
      </header>
      <div class="page-scroll" id="page-host">
        <div class="boot" id="boot">
          <p class="boot__title">Проекты</p>
          <p class="boot__text">Открываем локальные проекты…</p>
        </div>
      </div>
    </main>

  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>
    <div style="padding:40px;font-family:system-ui;color:#F5F5F7;background:#0B0B0E;">
      DotLingo требует JavaScript. Включите его и перезапустите приложение.
    </div>
  </noscript>
</body>
</html>
