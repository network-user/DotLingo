<!--
  DotLingo - каркас UI (pywebview + vanilla JS, без сборки).
  Страницы регистрируются через js/router.js из js/main.js (волна 2).
-->
<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="DotLingo - локальный перевод документов">
  <title>DotLingo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0B0E'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='-apple-system, Segoe UI, sans-serif' font-size='17' font-weight='700' fill='%23F5F5F7'%3ED%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/pages-work.css">
  <link rel="stylesheet" href="styles/pages-library.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div id="app">

    <aside class="sidebar">
      <div class="brand">
        <div class="brand__mark" aria-hidden="true">D</div>
        <div class="brand__text">
          <span class="brand__name">DotLingo</span>
          <span class="brand__sub">локальный перевод</span>
        </div>
      </div>

      <nav class="nav" id="nav" aria-label="Основная навигация">
        <div class="nav-group">
          <div class="nav-group__label">Работа</div>
          <button class="nav-item" type="button" data-page="projects">
            <span class="nav-item__icon" data-icon="folder"></span>
            <span class="nav-item__label">Проекты</span>
            <span class="nav-item__hint">1</span>
          </button>
          <button class="nav-item" type="button" data-page="documents">
            <span class="nav-item__icon" data-icon="document"></span>
            <span class="nav-item__label">Документы</span>
            <span class="nav-item__hint">2</span>
          </button>
          <button class="nav-item" type="button" data-page="review">
            <span class="nav-item__icon" data-icon="search"></span>
            <span class="nav-item__label">Проверка</span>
            <span class="nav-item__hint">3</span>
          </button>
          <button class="nav-item" type="button" data-page="queue">
            <span class="nav-item__icon" data-icon="list"></span>
            <span class="nav-item__label">Очередь</span>
            <span class="nav-item__hint">4</span>
          </button>
        </div>

        <div class="nav-group">
          <div class="nav-group__label">Библиотека</div>
          <button class="nav-item" type="button" data-page="models">
            <span class="nav-item__icon" data-icon="chip"></span>
            <span class="nav-item__label">Модели</span>
            <span class="nav-item__hint">5</span>
          </button>
          <button class="nav-item" type="button" data-page="glossary">
            <span class="nav-item__icon" data-icon="book"></span>
            <span class="nav-item__label">Глоссарий</span>
            <span class="nav-item__hint">6</span>
          </button>
        </div>

        <div class="nav-group">
          <div class="nav-group__label">Приложение</div>
          <button class="nav-item" type="button" data-page="settings">
            <span class="nav-item__icon" data-icon="settings"></span>
            <span class="nav-item__label">Настройки</span>
            <span class="nav-item__hint">7</span>
          </button>
        </div>
      </nav>

      <div class="sidebar__footer">
        <button class="theme-toggle" id="theme-toggle" type="button" title="Переключить тему">
          <span class="theme-toggle__icon" data-icon="sun"></span>
          <span class="theme-toggle__label" id="theme-label">Светлая тема</span>
        </button>
        <div class="device-status" id="device-status" data-state="unknown">
          <span class="device-status__dot"></span>
          <span class="device-status__label" id="device-label">Устройство…</span>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="main-header">
        <div class="main-header__titles">
          <h1 id="page-title">DotLingo</h1>
          <p class="main-header__subtitle" id="page-subtitle" hidden></p>
        </div>
        <div class="main-header__actions" id="page-actions"></div>
      </header>
      <div class="page-scroll" id="page-host"></div>
    </main>

  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>
  <div id="modal-root"></div>

  <noscript>
    <div style="padding:40px;font-family:system-ui;color:#F5F5F7;background:#0B0B0E;">
      DotLingo требует JavaScript. Включите его и перезапустите приложение.
    </div>
  </noscript>
</body>
</html>
