[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dotlingo"
version = "0.1.0"
description = "Локальное настольное приложение для перевода документов"
requires-python = ">=3.12,<3.14"
dependencies = [
  "psutil>=6,<8",
  "python-docx>=1.1,<2",
  "pywebview>=5,<7",
]

[project.optional-dependencies]
inference = ["llama-cpp-python==0.3.35"]
pdf = ["pypdf>=5,<7"]
build = ["pyinstaller>=6.12,<7", "Pillow>=10,<13"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
dotlingo = "dotlingo.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dotlingo = [
  "models.json",
  "assets/*",
  "web/*.html",
  "web/js/*.js",
  "web/js/pages/*.js",
  "web/styles/*.css",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
